<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skanskamaskin</title>
</head>

<body>
  <h2>Åpner maskindokumentasjon...</h2>

  <script>
    const maskiner = {
      "431351101": "https://skanska.sharepoint.com/sites/NO-se259057/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2FNO%2Dse259057%2FShared%20Documents%2FGeneral%2F08%2E%20Maskiner%2F06%2E%20Maskin%20nr%20%2D%20dokumentasjon%2F01%2E%20Trafo%20og%20h%C3%B8yspentanlegg%2F4135101%20TA%2DF%20630kVA%2022%2D11%20til%200%2E4kV&viewid=89e33d5f%2D1a38%2D4965%2D9ef1%2Dd86856203289"
    };

    const params = new URLSearchParams(window.location.search);
    const maskinnummer = params.get("id");

    if (maskiner[maskinnummer]) {
      window.location.replace(maskiner[maskinnummer]);
    } else {
      document.body.innerHTML =
        "<h2>Fant ikke dokumentasjon for maskinnummer: " +
        maskinnummer +
        "</h2>";
    }
  </script>
</body>
</html>
