<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skanskamaskin</title>
</head>

<body>
  <h2>Åpner maskindokumentasjon...</h2>

  <script>
    async function finnMaskin() {
      const params = new URLSearchParams(window.location.search);
      const maskinnummer = params.get("id");

      if (!maskinnummer) {
        document.body.innerHTML = "<h2>Maskinnummer mangler</h2>";
        return;
      }

      try {
        const response = await fetch("Maskiner.csv");
        const csv = await response.text();

        const linjer = csv.trim().split(/\r?\n/);
        let funnet = false;

        for (let i = 1; i < linjer.length; i++) {
          const komma = linjer[i].indexOf(",");

          if (komma === -1) continue;

          const nummer = linjer[i].substring(0, komma).trim();
          const sharepoint = linjer[i].substring(komma + 1).trim();

          if (nummer === maskinnummer) {
            funnet = true;
            window.location.replace(sharepoint);
            break;
          }
        }

        if (!funnet) {
          document.body.innerHTML =
            "<h2>Fant ikke dokumentasjon for maskinnummer: " +
            maskinnummer +
            "</h2>";
        }

      } catch (error) {
        document.body.innerHTML =
          "<h2>Kunne ikke lese maskinregisteret.</h2>";
      }
    }

    finnMaskin();
  </script>
</body>
</html>
